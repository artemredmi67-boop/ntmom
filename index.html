<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose Your Favorite Recipe</title>
<meta property="og:title" content="Choose Your Favorite Recipe">
<meta property="og:description" content="Choose your favorite recipe.">
<meta property="og:image" content="https://i.postimg.cc/JhLZ4Hmx/photo-2026-07-09-14-36-56.jpg">
<meta property="og:type" content="website">
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif}
body{background:url('https://i.postimg.cc/ZqGgqcnx/photo-2026-07-09-14-36-56.jpg') center/cover no-repeat;display:flex;align-items:center;justify-content:center}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65))}

.wrap{position:relative;z-index:1;text-align:center;color:#fff;padding:8px}

h1{font-size:clamp(20px,4vw,30px);margin-bottom:12px}

.grid{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    cursor:pointer;
    border-radius:12px;
    overflow:hidden;
    max-width:180px;           /* Основная ширина */
    position:relative;
    animation:pulse 2s infinite;
    transition:.2s;
}
.card:hover{transform:scale(1.06)}
.card:active{transform:scale(0.94)}
.card img{display:block;width:100%;height:auto}

.label{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    background:linear-gradient(transparent, rgba(0,0,0,0.95));
    color:#fff;
    text-align:center;
    padding:10px 6px 8px;
    font-size:16px;
    font-weight:bold;
    text-shadow:0 2px 6px rgba(0,0,0,0.9);
    pointer-events:none;
}

/* === Сильная адаптация под телефон === */
@media (max-width: 480px) {
    .card{
        max-width: 168px;      /* Ещё меньше */
    }
    .label{
        font-size: 15.5px;
        padding: 9px 5px 7px;
    }
}

@media (max-width: 360px) {
    .card{max-width: 155px;}
    .label{font-size: 15px;}
}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
</style>
</head>
<body>
<div class="wrap">
    <h1 id="t">What would you choose?</h1>
   
    <div class="grid">
        <div class="card" onclick="go('https://grzvkg.datingcorrner.com/?utm_source=da57dc555e50572d&ban=other&j5=1&j6=1&s1=212364&s2=2215916')">
            <img src="https://i.postimg.cc/DZ1N4Xby/photo-2026-07-09-14-37-00.jpg">
            <div class="label" id="label1">КЛИКАЙ</div>
        </div>
       
        <div class="card" onclick="go('https://simal.top/click?o=3&a=6549&sub_id1=nut')">
            <img src="https://i.postimg.cc/cCZbRLQb/photo-2026-07-09-14-37-03.jpg">
            <div class="label" id="label2">КЛИКАЙ</div>
        </div>
    </div>
</div>

<script>
const tr = {
    ru: "Что вы выберете?",
    uk: "Що ви оберете?",
    de: "Was würdest du wählen?",
    fr: "Que choisiriez-vous ?",
    es: "¿Qué elegirías?",
    it: "Cosa sceglieresti?",
    pl: "Co wybierzesz?",
    pt: "O que você escolheria?",
    tr: "Hangisini seçerdin?",
    nl: "Wat zou jij kiezen?",
    en: "What would you choose?"
};

const clickTr = {
    ru: "КЛИКАЙ",
    uk: "КЛІКАЙ",
    de: "KLICK MICH",
    fr: "CLIQUE ICI",
    es: "CLIC AQUÍ",
    it: "CLICCA QUI",
    pl: "KLIKNIJ",
    pt: "CLIQUE AQUI",
    tr: "TIKLA",
    nl: "KLIK HIER",
    en: "CLICK HERE"
};

const lang = (navigator.language || "en").slice(0,2);
document.getElementById("t").textContent = tr[lang] || tr.en;

const labelText = clickTr[lang] || clickTr.en;
document.getElementById("label1").textContent = labelText;
document.getElementById("label2").textContent = labelText;

function go(u){
    setTimeout(() => location.href = u, 500);
}
</script>
</body>
</html>
